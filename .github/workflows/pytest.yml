name: Run Tests

on:
  push:
    branches: [ "**" ]          # "**" also matches branches with slashes, e.g. feature/x
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = minimum supported, 3.13 = version used in the Docker image
        python-version: [ "3.10", "3.13" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest

  postgres-migrations:
    name: Alembic on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jira_slack_bot
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U ci -d jira_slack_bot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/jira_slack_bot
      # Offline end-to-end run: sample Jira data, Slack messages only logged
      JIRA_BASE_URL: https://example.atlassian.net
      JIRA_PROJECT_KEY: KAN
      JIRA_MOCK_MODE: "true"
      SLACK_DRY_RUN: "true"
      LOG_DIR: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upgrade, verify, downgrade, upgrade again
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Bot smoke test against PostgreSQL
        run: |
          python -m src.main --once poll
          python -m src.main --once poll
          python -m src.main --once report

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag jira-slack-bot:ci .
