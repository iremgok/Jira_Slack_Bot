services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jira_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jira_slack_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  jira_bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides any DATABASE_URL in .env. The password must be URL-safe
      # (letters, digits, - _ . ~) or percent-encoded.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-jira_bot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jira_slack_bot}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      # Log to stdout only; read with "docker compose logs"
      LOG_DIR: ""
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
